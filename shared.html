<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared chat</title><style>body{margin:0;padding:24px;background:#111116;color:#f4f3fa;font:15px/1.6 system-ui}.wrap{max-width:800px;margin:40px auto}.card{background:#202029;border:1px solid #393945;border-radius:12px;padding:16px;margin:12px 0}a{color:#c9baff}</style>
<style>
:root{--accent:#b7a1ff;--ease:cubic-bezier(.2,.75,.25,1)}
body{background:radial-gradient(ellipse at 10% 0%,#b7a1ff12,transparent 38%),#111116}
.wrap{animation:share-rise .5s var(--ease) both}
.card{background:linear-gradient(145deg,#262631,#202029);border-color:#484454;border-radius:16px;box-shadow:0 8px 24px #0003;transition:transform .22s var(--ease),border-color .22s,box-shadow .22s}
.card:hover{transform:translateY(-3px);border-color:#8e7acb;box-shadow:0 14px 32px #0005}
a{display:inline-block;color:#d0c3ff;text-decoration:none;border:1px solid #65558d;border-radius:11px;padding:9px 14px;transition:all .2s var(--ease)}
a:hover{background:#b7a1ff20;transform:translateY(-2px);box-shadow:0 7px 18px #b7a1ff22}
@keyframes share-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<link rel="icon" type="image/png" href="/nova-icon.png"><link rel="apple-touch-icon" href="/nova-icon.png"></head><body><div class="wrap"><h1 id="title">Shared conversation</h1><p>Read-only shared chat</p><div id="msgs">Loading…</div><a href="/">Open Nova AI</a></div><script>let id=location.pathname.split('/').pop();fetch('/api/share/'+encodeURIComponent(id)).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('title').textContent=d.title;document.getElementById('msgs').innerHTML=(d.messages||[]).map(m=>'<div class="card"><b>'+(m.role==='user'?'You':'Assistant')+'</b><p style="white-space:pre-wrap">'+String(m.content||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p></div>').join('')}).catch(e=>document.getElementById('msgs').textContent=e.message)</script></body></html>

/* ===== Nova-DSS visual polish: GameUp-inspired depth, without changing the core theme ===== */
:root{
  --ui-ease:cubic-bezier(.2,.75,.25,1);
  --ui-glow:color-mix(in srgb,var(--accent) 24%,transparent);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 12% 0%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 34%),
    radial-gradient(ellipse at 90% 100%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 38%),
    var(--bg);
}
button,.btn,.genbtn,.deepthink,.send,.idea,.rowchat,.menu,.modal,.compose,.select,.field input,.field select{
  transition:background-color .22s var(--ui-ease),border-color .22s var(--ui-ease),
    color .22s var(--ui-ease),box-shadow .25s var(--ui-ease),transform .22s var(--ui-ease),
    filter .22s var(--ui-ease);
}
button{ -webkit-tap-highlight-color:transparent }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px;box-shadow:0 0 0 5px var(--ui-glow)
}
.side{
  background:linear-gradient(160deg,color-mix(in srgb,var(--side) 96%,var(--accent) 4%),var(--side));
  box-shadow:8px 0 30px #00000012;
}
.brand{padding:7px 7px 12px}
.logo,.mark{
  box-shadow:0 7px 22px var(--ui-glow),inset 0 1px 0 #ffffff75;
  position:relative;overflow:hidden;
}
.logo:after,.mark:after{
  content:"";position:absolute;inset:-80% auto -80% -35%;width:35%;
  transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff55,transparent);
  animation:nova-shine 6s ease-in-out infinite;
}
.btn,.genbtn,.deepthink{
  background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 94%,white 6%),var(--panel));
  box-shadow:0 2px 7px #00000014,inset 0 1px 0 #ffffff0a;
}
.btn:hover,.genbtn:hover,.deepthink:hover{
  transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 65%,var(--line));
  box-shadow:0 7px 18px #00000025,0 0 0 1px var(--ui-glow);
  filter:brightness(1.06)
}
.btn:active,.genbtn:active,.deepthink:active,.send:active,.idea:active{transform:translateY(0) scale(.97)}
.new{
  border-color:color-mix(in srgb,var(--accent) 38%,var(--line));
  background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));
}
.new:hover{background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 25%,var(--panel)),var(--hover))}
.new .plus{filter:drop-shadow(0 0 6px var(--ui-glow))}
.rowchat{border:1px solid transparent}
.rowchat:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--accent) 20%,var(--line))}
.rowchat.active{border-color:color-mix(in srgb,var(--accent) 34%,var(--line));box-shadow:inset 3px 0 var(--accent)}
.dots:hover{transform:rotate(90deg)}
.menu{
  box-shadow:0 18px 45px #0008,0 0 0 1px #ffffff08;
  backdrop-filter:blur(18px);
  animation:nova-pop .18s var(--ui-ease) both;
}
.menu button:hover{transform:translateX(3px)}
.top{
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(16px);
  box-shadow:0 1px 0 #ffffff05;
}
.topname{letter-spacing:.1px}
.select:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.messages{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.messages::-webkit-scrollbar,.lists::-webkit-scrollbar{width:7px}
.messages::-webkit-scrollbar-thumb,.lists::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
.welcome{
  background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 96%,var(--accent) 4%),var(--panel));
  border-color:color-mix(in srgb,var(--accent) 24%,var(--line));
  box-shadow:0 22px 65px #00000022,inset 0 1px 0 #ffffff0a;
  animation:nova-rise .65s var(--ui-ease) both;
}
.welcome h1{background:linear-gradient(100deg,var(--text),color-mix(in srgb,var(--accent) 78%,var(--text)));background-clip:text;-webkit-background-clip:text;color:transparent}
.idea{
  background:linear-gradient(145deg,color-mix(in srgb,var(--side) 95%,var(--accent) 5%),var(--side));
  box-shadow:0 4px 14px #00000012,inset 0 1px 0 #ffffff08;
}
.idea:hover{
  transform:translateY(-4px);border-color:var(--accent);
  box-shadow:0 12px 28px #00000028,0 0 0 1px var(--ui-glow);
}
.msg{animation:nova-rise .32s var(--ui-ease) both}
.avatar{box-shadow:0 4px 12px var(--ui-glow)}
.user .content{
  background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 92%,var(--accent) 8%),var(--panel));
  border-color:color-mix(in srgb,var(--accent) 24%,var(--line));
  box-shadow:0 5px 18px #00000012;
}
.content pre{box-shadow:inset 0 1px 0 #ffffff08}
.codecopy,.copy,.image-tools button{
  transition:all .2s var(--ui-ease)
}
.codecopy:hover,.copy:hover,.image-tools button:hover{
  color:var(--text);border-color:var(--accent);background:var(--hover);transform:translateY(-2px)
}
.genimage,.imgs img{box-shadow:0 10px 28px #0000002b;transition:transform .25s var(--ui-ease),box-shadow .25s var(--ui-ease)}
.genimage:hover,.imgs img:hover{transform:translateY(-2px);box-shadow:0 16px 36px #00000038}
.deepthink{box-shadow:0 3px 12px var(--ui-glow)}
.deepthink.active{box-shadow:0 0 0 3px var(--ui-glow),0 7px 22px var(--ui-glow)}
.compose{
  background:linear-gradient(145deg,color-mix(in srgb,var(--side) 96%,var(--accent) 4%),var(--side));
  box-shadow:0 12px 38px #00000024,inset 0 1px 0 #ffffff0b;
}
.compose:focus-within{
  border-color:color-mix(in srgb,var(--accent) 80%,var(--line));
  box-shadow:0 0 0 3px var(--ui-glow),0 14px 40px #0000002b;
}
.send{
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 82%,white 18%),var(--accent));
  box-shadow:0 5px 16px var(--ui-glow),inset 0 1px 0 #ffffff80;
  transition:transform .2s var(--ui-ease),box-shadow .2s var(--ui-ease),filter .2s;
}
.send:hover{transform:translateY(-3px) rotate(-4deg);box-shadow:0 9px 24px var(--ui-glow);filter:brightness(1.08)}
.modal{
  box-shadow:0 24px 80px #0009,inset 0 1px 0 #ffffff0a;
  animation:nova-rise .24s var(--ui-ease) both;
}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ui-glow)}
.primary,.welcome .welcome-ok{
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 78%,white 22%),var(--accent));
  box-shadow:0 5px 16px var(--ui-glow),inset 0 1px 0 #ffffff80;
}
.primary:hover,.welcome .welcome-ok:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 9px 22px var(--ui-glow)}
.toast{backdrop-filter:blur(16px);box-shadow:0 12px 35px #0008;animation:nova-pop .2s var(--ui-ease) both}
.image-viewer{backdrop-filter:blur(12px);animation:nova-fade .2s ease both}
.image-viewer img{box-shadow:0 20px 70px #0009;animation:nova-zoom .25s var(--ui-ease) both}
.preview{box-shadow:0 4px 12px #0003;transition:transform .2s}
.preview:hover{transform:translateY(-3px)}
@keyframes nova-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes nova-pop{from{opacity:0;transform:scale(.97) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes nova-fade{from{opacity:0}to{opacity:1}}
@keyframes nova-zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes nova-shine{0%,72%,100%{left:-45%}84%{left:125%}}
@media(max-width:700px){
  .side{box-shadow:20px 0 55px #0008}
  .top{backdrop-filter:blur(14px)}
  .welcome{margin:14px auto;border-radius:18px}
  .idea:hover,.btn:hover,.genbtn:hover,.deepthink:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* ===== Follow-up refinements: supplied Nova icon, stable menus, gentle hover scale ===== */
.logo{display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit}
.btn:hover,.genbtn:hover,.deepthink:hover,.send:hover,.idea:hover,.primary:hover,
.welcome .welcome-ok:hover{
  transform:scale(1.045)!important;
  filter:none!important;
  color:inherit;
}
.btn:active,.genbtn:active,.deepthink:active,.send:active,.idea:active,.primary:active{
  transform:scale(.975)!important;
}
.dots{
  flex:0 0 34px!important;width:34px!important;height:34px!important;
  display:inline-flex;align-items:center;justify-content:center;
  position:relative;z-index:2;cursor:pointer;
  touch-action:manipulation;
}
.dots:hover{transform:scale(1.06)!important;background:var(--hover)!important;color:var(--text)!important}
.menu{
  box-sizing:border-box!important;
  width:min(210px,calc(100vw - 16px))!important;
  max-width:calc(100vw - 16px)!important;
  max-height:calc(100dvh - 16px)!important;
  overflow-y:auto!important;overflow-x:hidden!important;
  padding:6px!important;
  transform-origin:top left;
  overscroll-behavior:contain;
}
.menu button{
  box-sizing:border-box;width:100%;min-height:36px;
  padding:9px 10px!important;white-space:normal;
  line-height:1.35;cursor:pointer;
}
.menu button:hover{transform:none!important;background:var(--hover)!important;color:var(--text)!important}
.rowchat{min-width:0;gap:5px}
.openchat{min-width:0}
@media(max-width:700px){
  .menu{width:min(210px,calc(100vw - 16px))!important}
}


/* ===== V3 corrections from screenshots ===== */
/* Use the actual Nova artwork in both the sidebar brand and the welcome/empty-chat hero. */
.logo,.mark{
  background:transparent!important;
  color:inherit!important;
  box-shadow:none!important;
  border:0!important;
  overflow:visible!important;
  padding:0!important;
}
.logo::before,.logo::after,.mark::before,.mark::after{content:none!important;display:none!important}
.logo img,.mark img{
  display:block!important;width:100%!important;height:100%!important;
  object-fit:contain!important;border:0!important;border-radius:0!important;
  background:transparent!important;box-shadow:none!important;
}
.logo{width:48px!important;height:48px!important;flex:0 0 48px}
.mark{width:112px!important;height:112px!important;border-radius:0!important;flex:0 0 auto}
.welcome .mark{margin:0 auto 6px!important}
.welcome .mark img{filter:drop-shadow(0 8px 18px #008cff30)}
/* Keep the chat-list row completely stationary on hover; no extra pill/ghost shape. */
.rowchat,.rowchat:hover,.rowchat:focus,.rowchat:focus-within{
  transform:none!important;
  box-shadow:none!important;
}
.rowchat:hover{
  background:transparent!important;
  border-color:transparent!important;
}
.rowchat.active:hover{
  background:transparent!important;
  border-color:color-mix(in srgb,var(--accent) 34%,var(--line))!important;
  box-shadow:inset 3px 0 var(--accent)!important;
}
.openchat:hover,.dots:hover{transform:none!important}
.dots:hover{background:transparent!important;color:var(--muted)!important}
.rowchat .dots:hover{background:transparent!important}


/* ===== V4: fixed welcome view, animated spectrum composer, soft accent themes ===== */
/* Keep the empty-chat welcome card inside the available chat viewport. */
.messages:has(.welcome){overflow:hidden!important}
.messages:has(.welcome)>.inner{height:100%;min-height:0}
.messages .welcome{
  height:100%!important;min-height:0!important;box-sizing:border-box;
  padding:clamp(10px,2vh,22px)!important;gap:0;
  justify-content:center;overflow:hidden;
}

/* ===== V6: a neon tracer physically follows the rounded rectangle perimeter ===== */

function render(){lists();let c=current();if(c?.model)selectedModel=c.model;syncModelButton();$('topname').textContent=c?title(c):(lang==='fa'?'گفت‌وگوی جدید':'New chat');$('topname').dir=textDirection($('topname').textContent);$('topname').style.textAlign='left';$('inner').innerHTML='';if(!c||!c.messages?.length){$('inner').innerHTML=lang==='fa'?`<div class="welcome" dir="rtl"><div class="mark"><img src="/nova-icon.png" alt="Nova-DSS CPL Ai"></div><h1>چه چیزی در ذهنته؟</h1><p>سؤال بپرس، تصویر بارگذاری کن، ایده‌پردازی کن یا با هم چیزی بنویسیم.</p><div class="ideas"><button class="idea" data-p="Help me build a website step by step"><b>⌘ ساختن یک چیز</b><span>ایده‌ات را به برنامه تبدیل کن</span></button><button class="idea" data-p="Explain a complex topic simply"><b>✧ یادگیری</b><span>موضوع سخت را ساده‌تر بفهم</span></button><button class="idea" data-p="Help me brainstorm creative ideas"><b>◇ ایده‌پردازی</b><span>راه‌های تازه را بررسی کن</span></button><button class="idea" data-p="Help me write a professional email"><b>✎ نوشتن با هم</b><span>با یک پیش‌نویس شروع کن</span></button></div></div>`:`<div class="welcome"><div class="mark"><img src="/nova-icon.png" alt="Nova-DSS CPL Ai"></div><h1>What’s on your mind?</h1><p>Ask a question, upload an image, brainstorm, or write something together.</p><div class="ideas"><button class="idea" data-p="Help me build a website step by step"><b>⌘ Build something</b><span>Turn an idea into a plan</span></button><button class="idea" data-p="Explain a complex topic simply"><b>✧ Learn something</b><span>Make a hard topic clearer</span></button><button class="idea" data-p="Help me brainstorm creative ideas"><b>◇ Brainstorm ideas</b><span>Explore possibilities</span></button><button class="idea" data-p="Help me write a professional email"><b>✎ Write with me</b><span>Start with a rough draft</span></button></div></div>`;$('inner').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p;resize()})}else{c.messages.forEach(m=>$('inner').append(msg(m)));scroll()}}
function textDirection(text){const first=String(text||'').match(/\S/);if(!first)return'ltr';return/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(first[0])?'rtl':'ltr'}function setDirection(el,text){if(!el)return;const dir=textDirection(text);el.dir=dir;el.style.textAlign=dir==='rtl'?'right':'left'}
function msg(m){let n=document.createElement('article');n.className='msg '+m.role;let pdfMarkup=m.attachments?.length?'<div class="pdf-attachments">'+m.attachments.map(a=>'<span>PDF · '+esc(a.name)+'</span>').join('')+'</div>':'';let imgs=m.images?.length?'<div class="imgs">'+m.images.map((i,idx)=>'<div class="image-item"><img class="genimage" alt="Attachment or generated image" data-image-index="'+idx+'" src="'+i+'"><div class="image-tools"><button type="button" class="open-image" data-src="'+i+'">⤢ Open large</button><button type="button" class="download-image" data-src="'+i+'" data-name="nova-ai-image-'+(idx+1)+'.png">↓ Download image</button></div></div>').join('')+'</div>':'';let txt=esc(m.content).replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(_,language,code)=>{const raw=code.replace(/\n$/,'');let highlighted=esc(raw);if(window.hljs&&raw.trim()){try{highlighted=language&&hljs.getLanguage(language)?hljs.highlight(raw,{language,ignoreIllegals:true}).value:hljs.highlightAuto(raw).value}catch{}}return '<div class="codewrap"><button class="codecopy" type="button">Copy code</button><pre><code class="hljs language-'+esc(language||'plaintext')+'">'+highlighted+'</code></pre></div>'}).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');n.innerHTML=`<div class="avatar">${m.role==='user'?'Y':'✳'}</div><div class="bodymsg"><div class="role">${m.role==='user'?'You':'Nova-DSS CPL Ai'}</div>${pdfMarkup}${imgs}<div class="content">${txt}</div>${m.content?`<div class="copy-row"><button class="copy" type="button">${lang==='fa'?'کپی متن':'Copy text'}</button></div>`:''}</div>`;setDirection(n.querySelector('.content'),m.content||'');const copyRow=n.querySelector('.copy-row');if(copyRow)setDirection(copyRow,m.content||'');n.querySelectorAll('.open-image').forEach(b=>b.onclick=()=>openImageViewer(b.dataset.src));n.querySelectorAll('.download-image').forEach(b=>b.onclick=()=>downloadImage(b.dataset.src,b.dataset.name));n.querySelectorAll('.codecopy').forEach(b=>b.onclick=()=>{let code=b.parentElement.querySelector('code').textContent;navigator.clipboard.writeText(code).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy code',1200)}).catch(()=>say('Clipboard unavailable'))});let b=n.querySelector('.copy');if(b)b.onclick=()=>navigator.clipboard.writeText(m.content).then(()=>say(lang==='fa'?'متن کپی شد':'Text copied')).catch(()=>say(lang==='fa'?'دسترسی به کلیپ‌بورد ممکن نیست':'Clipboard unavailable'));return n}

$('attach').onclick=()=>$('files').click();$('files').onchange=async e=>{const picked=Array.from(e.target.files||[]);if(!picked.length)return;const status=$('uploadStatus');status.textContent=lang==='fa'?'در حال آپلود و پردازش فایل...':'Uploading and processing files...';status.classList.add('visible');$('attach').disabled=true;try{for(let f of picked){if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){if(f.size>15*1024*1024){say(lang==='fa'?'حجم PDF باید کمتر از ۱۵ مگابایت باشد':'PDF must be under 15 MB');continue}if(!window.pdfjsLib)throw Error('PDF reader library did not load.');const bytes=new Uint8Array(await f.arrayBuffer());const doc=await pdfjsLib.getDocument({data:bytes}).promise;if(doc.numPages>30){say(lang==='fa'?'حداکثر ۳۰ صفحه از هر PDF پشتیبانی می‌شود':'Only the first 30 pages of a PDF are supported');}let extracted='';for(let pageNo=1;pageNo<=Math.min(doc.numPages,30);pageNo++){const page=await doc.getPage(pageNo);const tc=await page.getTextContent();const line=tc.items.map(x=>x.str).join(' ');extracted+='\n[Page '+pageNo+']\n'+line;if(extracted.length>180000){extracted=extracted.slice(0,180000);break}}if(!extracted.trim())say(lang==='fa'?'متنی در PDF پیدا نشد؛ ممکن است فایل اسکن‌شده باشد.':'No selectable text found. This may be a scanned PDF.');else pdfs.push({name:f.name,text:extracted});continue}if(!f.type.startsWith('image/'))continue;if(f.size>5*1024*1024){say(lang==='fa'?'حجم تصویر باید کمتر از ۵ مگابایت باشد':'Images must be under 5 MB');continue}images.push(await new Promise((ok,fail)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>fail(new Error('Could not read image'));r.readAsDataURL(f)}))}preview()}catch(err){say((lang==='fa'?'خطا در پردازش فایل: ':'File processing failed: ')+err.message)}finally{e.target.value='';status.classList.remove('visible');status.textContent='';$('attach').disabled=false}};

async function downloadImage(src,name){try{const r=await fetch(src);if(!r.ok)throw Error('Download failed');const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name||'nova-ai-image.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){try{window.open(src,'_blank','noopener')}catch{}say('Image opened in a new tab. If download did not start, use the image menu to save it.')}} 
$('deepthink').onclick=()=>{deepthinkEnabled=!deepthinkEnabled;$('deepthink').classList.toggle('active',deepthinkEnabled);$('deepthink').setAttribute('aria-pressed',String(deepthinkEnabled));$('deepthink').innerHTML=deepthinkEnabled?'✧ Deepthink On':'✧ Deepthink';say(deepthinkEnabled?'Deepthink enabled':'Deepthink disabled')};
async function send(){if(busy){controller?.abort();return}let text=$('prompt').value.trim();if(!text&&!images.length&&!pdfs.length)return;if(!token){authModal();say('Sign in to save and send chats');return}if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';if(!window.puter?.ai){say('Puter.js unavailable. Check your connection.');return}try{if(window.puter.auth?.isSignedIn&&!await puter.auth.isSignedIn())await puter.auth.signIn()}catch(e){say('Puter sign-in is needed to use AI: '+e.message);return}if(!current()){try{let r=await api('/api/chats',{method:'POST',body:JSON.stringify({title:text.slice(0,42)||pdfs[0]?.name||'Image question',model:selectedModel})});chats.push(r.chat);activeId=r.chat.id}catch(e){say(e.message);return}}
let c=current();c.model=c.model||selectedModel;let imgs=images.slice(),docs=pdfs.slice();images=[];pdfs=[];preview();let pdfContext=docs.map(d=>'\n\n[PDF FILE: '+d.name+']\n'+d.text).join('');let fullText=(text||'')+pdfContext;c.messages.push({role:'user',content:fullText||'Please describe this image.',images:imgs,attachments:docs.map(d=>({name:d.name,type:'pdf'}))});if(c.title==='New chat')c.title=(text||docs[0]?.name||'Image question').slice(0,45);$('prompt').value='';resize();await persist(c);
let hist=c.messages.slice(0,-1).map(m=>m.role==='user'&&m.images?.length?{role:'user',content:[{type:'text',text:m.content},...m.images.map(url=>({type:'image_url',image_url:{url}}))]}:{role:m.role,content:m.content});let content=imgs.length?[{type:'text',text:fullText||'Please describe this image.'},...imgs.map(url=>({type:'image_url',image_url:{url}}))]:fullText;c.messages.push({role:'assistant',content:''});render();busy=true;controller=new AbortController();$('send').textContent='■';
try{let stream=await puter.ai.chat([{role:'system',content:`You are Nova-DSS CPL Ai, a helpful assistant. ${deepthinkEnabled?'Deepthink mode is enabled: reason carefully internally, break complex tasks into clear steps, verify assumptions, and give a well-structured answer. Do not reveal hidden chain-of-thought; provide concise reasoning summaries instead.':''} Use Markdown where helpful; be honest about uncertainty. When replying in Persian, use natural Persian and right-to-left formatting.`},...hist,{role:'user',content}],{model:c.model,stream:true,signal:controller.signal});let a=c.messages.at(-1),target=null;for await(let p of stream){if(p.type==='error')throw Error(p.message||'AI error');if(p.type==='text'&&p.text){a.content+=p.text;if(!target){render();target=$('inner').querySelectorAll('.msg.assistant .content');target=target[target.length-1]}if(target){target.textContent=a.content;setDirection(target,a.content)}scroll()}}if(!a.content)a.content='No text response received.'}catch(e){let a=c.messages.at(-1);if(e.name==='AbortError'){if(!a.content)c.messages.pop();else a.content+='\n\n(Stopped)'}else a.content+=(a.content?'\n\n':'')+'Error: '+e.message}finally{busy=false;controller=null;$('send').textContent='↑';await persist(c);render()}}

async function generateImage(){const prompt=$('prompt').value.trim();if(!prompt){say('Write a description of the image first.');$('prompt').focus();return}if(!token){authModal();say('Sign in to save generated images');return}if(!window.puter?.ai?.txt2img){say('Image generation is not available in this Puter.js version.');return}try{if(window.puter.auth?.isSignedIn&&!await puter.auth.isSignedIn())await puter.auth.signIn();let c=current();if(!c){let r=await api('/api/chats',{method:'POST',body:JSON.stringify({title:prompt.slice(0,42)||'Generated image',model:selectedModel})});chats.push(r.chat);activeId=r.chat.id;c=r.chat}c.model=c.model||selectedModel;const promptText=prompt;$('prompt').value='';resize();c.messages.push({role:'user',content:'Generate an image: '+promptText});c.title=c.title==='New chat'?promptText.slice(0,45):c.title;render();say('Generating image…');const result=await puter.ai.txt2img(promptText);let src='';if(typeof result==='string')src=result;else if(result instanceof HTMLImageElement)src=result.src;else if(result?.src)src=result.src;else if(result?.url)src=result.url;if(!src)throw Error('Puter returned an image in an unsupported format.');c.messages.push({role:'assistant',content:'Generated image for: '+promptText,images:[src]});await persist(c);render();say('Image generated')}catch(e){say('Image generation failed: '+e.message)}}$('generate').onclick=generateImage;
$('send').onclick=send;$('prompt').oninput=resize;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('new').onclick=newChat;$('hamb').onclick=toggleDrawer;$('drawerClose').onclick=closeDrawer;function closeDrawer(){$('side').classList.remove('open');$('appRoot')?.classList.remove('sidebar-collapsed');$('drawerShade')?.classList.remove('visible')}function toggleDrawer(){if(window.matchMedia('(max-width:900px)').matches){$('side').classList.toggle('open');$('drawerShade')?.classList.toggle('visible',$('side').classList.contains('open'))}else{$('appRoot').classList.toggle('sidebar-collapsed')}}$('drawerShade').onclick=closeDrawer;window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:900px)').matches){$('side').classList.remove('open');$('drawerShade').classList.remove('visible')}});$('modelBtn').onclick=()=>{const c=current();choiceModal(lang==='fa'?'انتخاب مدل هوش مصنوعی':'Choose AI model',MODEL_OPTIONS,selectedModel,async value=>{if(c&&c.messages?.length&&value!==c.model){say(lang==='fa'?'برای تغییر مدل، ابتدا یک گفت‌وگوی جدید ایجاد کنید.':'Start a new chat before changing the AI model.');return}selectedModel=value;if(c){c.model=value;await persist(c)}syncModelButton()})};
function choiceModal(title,options,selected,onPick,onBack=null){const rows=options.map(([value,label])=>`<button type="button" class="choice-item ${value===selected?'selected':''}" data-value="${esc(value)}"><span>${esc(label)}</span><span class="check">${value===selected?'✓':''}</span></button>`).join('');modal(title,`<div class="choice-list" role="listbox">${rows}</div>`,[{label:lang==='fa'?'بازگشت':'Back',fn:()=>{if(onBack)onBack();else $('modal').innerHTML=''}}],{showX:!onBack});$('mbody').querySelectorAll('.choice-item').forEach(b=>b.onclick=()=>{const v=b.dataset.value;$('modal').innerHTML='';onPick(v)})}
function inputModal(title,label,value,onSave){modal(title,`<div class="field"><label>${esc(label)}</label><input id="dialogInput" maxlength=120 value="${esc(value)}"></div>`,[{label:lang==='fa'?'انصراف':'Cancel',fn:()=>$('modal').innerHTML=''}, {label:lang==='fa'?'ذخیره':'Save',primary:true,fn:()=>{const v=$('dialogInput').value;$('modal').innerHTML='';onSave(v)}}]);$('dialogInput').focus();$('dialogInput').select()}
function confirmModal(title,message,onYes,danger=false){modal(title,`<div class="notice">${esc(message)}</div>`,[{label:lang==='fa'?'انصراف':'Cancel',fn:()=>$('modal').innerHTML=''}, {label:lang==='fa'?'تأیید':'Confirm',primary:!danger,danger,fn:()=>{$('modal').innerHTML='';onYes()}}])}
function modal(title,body,buttons,options={}){const showX=options.showX!==false;$('modal').innerHTML=`<div class="backdrop"><div class="modal"><div class="modalhead"><h2>${esc(title)}</h2>${showX?'<button class="btn" id="x" type="button" aria-label="Close">×</button>':''}</div><div id="mbody">${body}</div><div class="modalactions" id="mact"></div></div></div>`;if(showX)$('x').onclick=()=>$('modal').innerHTML='';$('modal').firstElementChild.onclick=e=>{if(e.target===$('modal').firstElementChild)$('modal').innerHTML=''};buttons.forEach(x=>{let b=document.createElement('button');b.className='btn '+(x.primary?'primary':'')+(x.danger?' danger-action':'');b.textContent=x.label;b.onclick=x.fn;$('mact').append(b)})}
function authModal(){let mode='login';function draw(){modal('Account',`<div class="notice">Account and chat data are saved on this server in the <code>data/</code> folder.</div><div class="field"><label>Username</label><input id="au" autocomplete="username" minlength="3" maxlength="32" placeholder="username"></div><div class="field"><label>Password (8+ characters)</label><input id="ap" type="password" autocomplete="current-password" minlength="8"></div><div id="ae" style="color:var(--danger);font-size:12px"></div><p><button class="btn" id="loginTab">Sign in</button> <button class="btn" id="registerTab">Create account</button></p>`,[{label:'Cancel',fn:()=>$('modal').innerHTML=' '},{label:mode==='login'?'Sign in':'Create account',primary:true,fn:async()=>{try{let r=await api('/api/'+mode,{method:'POST',body:JSON.stringify({username:$('au').value,password:$('ap').value})});token=r.token;localStorage.setItem('nova-token',token);account=r.account;settings={...settings,...account.settings};if(account.settings?.font==='system'&&!localStorage.getItem('nova-font-user-choice'))settings.font='main';lang=settings.language||lang;$('modal').innerHTML='';apply();updateAccount();await load();say('Welcome!');if(mode==='register')showWelcome()}catch(e){$('ae').textContent=e.message}}}]);$('loginTab').onclick=()=>{mode='login';draw()};$('registerTab').onclick=()=>{mode='register';draw()}}draw()}
function updateAccount(){$('who').textContent=account?account.username:'Not signed in';$('account').textContent=account?'Sign out':'Sign in'}
$('account').onclick=async()=>{if(!account){authModal();return}confirmModal(lang==='fa'?'خروج از حساب':'Sign out','',async()=>{try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}token='';localStorage.removeItem('nova-token');sessionStorage.removeItem('nova-token');account=null;chats=[];activeId=null;updateAccount();render()})};
$('settings').onclick=()=>{closeDrawer();let draft={theme:settings.theme,accentTheme:settings.accentTheme||'purple',language:lang,font:settings.font||'main'};const choices={theme:[['dark',lang==='fa'?'تیره':'Dark'],['light',lang==='fa'?'روشن':'Light']],accentTheme:[['purple','Purple'],['orange','Orange'],['green','Green'],['blue','Blue'],['red','Red'],['white','White']],language:[['en','English'],['fa','فارسی']],font:[['main',lang==='fa'?'فونت اصلی':'Main Font'],['system',lang==='fa'?'فونت سیستم':'System Font']]};const labels={theme:lang==='fa'?'حالت نمایش':'Appearance',accentTheme:lang==='fa'?'رنگ اصلی':'Accent color',language:lang==='fa'?'زبان برنامه':'Interface language',font:lang==='fa'?'فونت':'Font'};function valueLabel(key){return choices[key].find(x=>x[0]===draft[key])?.[1]||draft[key]}function drawSettings(){modal(lang==='fa'?'تنظیمات':'Settings',`<div class="field"><label>${lang==='fa'?'نام کاربری':'Account username'}</label><input id="accountname" maxlength="32" value="${esc(account?.username||'')}" placeholder="${lang==='fa'?'برای تغییر نام وارد شوید':'Sign in to change username'}"></div><div class="notice">${lang==='fa'?'تغییر نام کاربری، نام نمایشی حساب را به‌روزرسانی می‌کند.':'Changing the username updates the account display name.'}</div><div class="field"><label>${lang==='fa'?'نام هوش مصنوعی':'AI name'}</label><input id="sname" maxlength="50" value="${esc(settings.assistantName||'Nova-DSS CPL Ai')}"></div>${Object.keys(choices).map(k=>`<div class="field"><label>${labels[k]}</label><button type="button" class="choice-trigger" data-setting="${k}"><span>${esc(valueLabel(k))}</span><span>▾</span></button></div>`).join('')}<div class="notice">${lang==='fa'?'برای استفاده از فونت اصلی، فایل WOFF2 را با نام custom.woff2 در پوشه fonts قرار دهید.':'For Main Font, place your WOFF2 file at fonts/custom.woff2.'}</div>`,[{label:lang==='fa'?'حذف همه چت‌ها':'Delete all chats',danger:true,fn:()=>{if(!token){say(lang==='fa'?'ابتدا وارد شوید':'Sign in first');return}confirmModal(lang==='fa'?'حذف همه گفت‌وگوها':'Delete all chats',lang==='fa'?'همه چت‌ها و لینک‌های اشتراک حذف شوند؟':'Delete ALL chats and share links?',async()=>{try{await api('/api/chats/all',{method:'DELETE'});chats=[];activeId=null;$('modal').innerHTML='';render();say(lang==='fa'?'همه چت‌ها حذف شدند':'All chats deleted')}catch(e){say(e.message)}},true)}},{label:lang==='fa'?'بازگشت':'Back',fn:()=>$('modal').innerHTML=''}, {label:lang==='fa'?'ذخیره تنظیمات':'Save settings',primary:true,fn:async()=>{settings={assistantName:$('sname').value.trim()||'Nova-DSS CPL Ai',...draft};localStorage.setItem('nova-font-user-choice','1');lang=settings.language;apply();if(token)try{await api('/api/settings',{method:'PUT',body:JSON.stringify(settings)});const uname=$('accountname').value.trim();if(uname&&uname!==account.username){const r=await api('/api/account',{method:'PATCH',body:JSON.stringify({username:uname})});account=r.account;updateAccount()}}catch(e){say(e.message);return}$('modal').innerHTML='';say(lang==='fa'?'تنظیمات ذخیره شد':'Settings saved')}}],{showX:false});$('mbody').querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{const k=b.dataset.setting;choiceModal(labels[k],choices[k],draft[k],v=>{draft[k]=v;drawSettings()},drawSettings)})}drawSettings()};

async function boot(){const migrateMainFont=!localStorage.getItem('nova-main-font-migrated');normalizeSettings();if(migrateMainFont){settings.font='main';localStorage.setItem('nova-main-font-migrated','1')}apply();applyLanguage();syncModelButton();updateAccount();if(token){try{let r=await api('/api/me');account=r.account;settings={...settings,...account.settings};if((migrateMainFont||!localStorage.getItem('nova-font-user-choice'))&&account.settings?.font==='system')settings.font='main';if(migrateMainFont)settings.font='main';lang=settings.language||lang;apply();updateAccount();await load()}catch{token='';localStorage.removeItem('nova-token');sessionStorage.removeItem('nova-token')}}if(!token){render();authModal()}}
document.addEventListener('click',e=>{if(!e.target.closest('.dots')&&!e.target.closest('.menu'))document.querySelectorAll('.menu').forEach(x=>x.remove())});window.addEventListener('resize',()=>document.querySelectorAll('.menu').forEach(x=>x.remove()));document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.menu').forEach(x=>x.remove());document.querySelectorAll('.image-viewer').forEach(x=>x.remove());if(busy)controller?.abort()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();newChat()}});boot();
})();

/* ===== Nova-DSS visual polish: GameUp-inspired depth, without changing the core theme ===== */
:root{
  --ui-ease:cubic-bezier(.2,.75,.25,1);
  --ui-glow:color-mix(in srgb,var(--accent) 24%,transparent);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 12% 0%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 34%),
    radial-gradient(ellipse at 90% 100%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 38%),
    var(--bg);
}
button,.btn,.genbtn,.deepthink,.send,.idea,.rowchat,.menu,.modal,.compose,.select,.field input,.field select{
  transition:background-color .22s var(--ui-ease),border-color .22s var(--ui-ease),
    color .22s var(--ui-ease),box-shadow .25s var(--ui-ease),transform .22s var(--ui-ease),
    filter .22s var(--ui-ease);
}
button{ -webkit-tap-highlight-color:transparent }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px;box-shadow:0 0 0 5px var(--ui-glow)
}
.side{
  background:linear-gradient(160deg,color-mix(in srgb,var(--side) 96%,var(--accent) 4%),var(--side));
  box-shadow:8px 0 30px #00000012;
}
.brand{padding:7px 7px 12px}
.logo,.mark{
  box-shadow:0 7px 22px var(--ui-glow),inset 0 1px 0 #ffffff75;
  position:relative;overflow:hidden;
}
.logo:after,.mark:after{
  content:"";position:absolute;inset:-80% auto -80% -35%;width:35%;
  transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff55,transparent);
  animation:nova-shine 6s ease-in-out infinite;
}
.btn,.genbtn,.deepthink{
  background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 94%,white 6%),var(--panel));
  box-shadow:0 2px 7px #00000014,inset 0 1px 0 #ffffff0a;
}
.btn:hover,.genbtn:hover,.deepthink:hover{
  transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 65%,var(--line));
  box-shadow:0 7px 18px #00000025,0 0 0 1px var(--ui-glow);
  filter:brightness(1.06)
}
.btn:active,.genbtn:active,.deepthink:active,.send:active,.idea:active{transform:translateY(0) scale(.97)}
.new{
  border-color:color-mix(in srgb,var(--accent) 38%,var(--line));
  background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));
}
.new:hover{background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 25%,var(--panel)),var(--hover))}
.new .plus{filter:drop-shadow(0 0 6px var(--ui-glow))}
.rowchat{border:1px solid transparent}
.rowchat:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--accent) 20%,var(--line))}
.rowchat.active{border-color:color-mix(in srgb,var(--accent) 34%,var(--line));box-shadow:inset 3px 0 var(--accent)}
.dots:hover{transform:rotate(90deg)}
.menu{
  box-shadow:0 18px 45px #0008,0 0 0 1px #ffffff08;
  backdrop-filter:blur(18px);
  animation:nova-pop .18s var(--ui-ease) both;
}
.menu button:hover{transform:translateX(3px)}
.top{
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(16px);
  box-shadow:0 1px 0 #ffffff05;
}
.topname{letter-spacing:.1px}
.select:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.messages{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.messages::-webkit-scrollbar,.lists::-webkit-scrollbar{width:7px}
.messages::-webkit-scrollbar-thumb,.lists::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
.welcome{
  background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 96%,var(--accent) 4%),var(--panel));
  border-color:color-mix(in srgb,var(--accent) 24%,var(--line));
  box-shadow:0 22px 65px #00000022,inset 0 1px 0 #ffffff0a;
  animation:nova-rise .65s var(--ui-ease) both;
}
.welcome h1{background:linear-gradient(100deg,var(--text),color-mix(in srgb,var(--accent) 78%,var(--text)));background-clip:text;-webkit-background-clip:text;color:transparent}
.idea{
  background:linear-gradient(145deg,color-mix(in srgb,var(--side) 95%,var(--accent) 5%),var(--side));
  box-shadow:0 4px 14px #00000012,inset 0 1px 0 #ffffff08;
}
.idea:hover{
  transform:translateY(-4px);border-color:var(--accent);
  box-shadow:0 12px 28px #00000028,0 0 0 1px var(--ui-glow);
}
.msg{animation:nova-rise .32s var(--ui-ease) both}
.avatar{box-shadow:0 4px 12px var(--ui-glow)}
.user .content{
  background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 92%,var(--accent) 8%),var(--panel));
  border-color:color-mix(in srgb,var(--accent) 24%,var(--line));
  box-shadow:0 5px 18px #00000012;
}
.content pre{box-shadow:inset 0 1px 0 #ffffff08}
.codecopy,.copy,.image-tools button{
  transition:all .2s var(--ui-ease)
}
.codecopy:hover,.copy:hover,.image-tools button:hover{
  color:var(--text);border-color:var(--accent);background:var(--hover);transform:translateY(-2px)
}
.genimage,.imgs img{box-shadow:0 10px 28px #0000002b;transition:transform .25s var(--ui-ease),box-shadow .25s var(--ui-ease)}
.genimage:hover,.imgs img:hover{transform:translateY(-2px);box-shadow:0 16px 36px #00000038}
.deepthink{box-shadow:0 3px 12px var(--ui-glow)}
.deepthink.active{box-shadow:0 0 0 3px var(--ui-glow),0 7px 22px var(--ui-glow)}
.compose{
  background:linear-gradient(145deg,color-mix(in srgb,var(--side) 96%,var(--accent) 4%),var(--side));
  box-shadow:0 12px 38px #00000024,inset 0 1px 0 #ffffff0b;
}
.compose:focus-within{
  border-color:color-mix(in srgb,var(--accent) 80%,var(--line));
  box-shadow:0 0 0 3px var(--ui-glow),0 14px 40px #0000002b;
}
.send{
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 82%,white 18%),var(--accent));
  box-shadow:0 5px 16px var(--ui-glow),inset 0 1px 0 #ffffff80;
  transition:transform .2s var(--ui-ease),box-shadow .2s var(--ui-ease),filter .2s;
}
.send:hover{transform:translateY(-3px) rotate(-4deg);box-shadow:0 9px 24px var(--ui-glow);filter:brightness(1.08)}
.modal{
  box-shadow:0 24px 80px #0009,inset 0 1px 0 #ffffff0a;
  animation:nova-rise .24s var(--ui-ease) both;
}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ui-glow)}
.primary,.welcome .welcome-ok{
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 78%,white 22%),var(--accent));
  box-shadow:0 5px 16px var(--ui-glow),inset 0 1px 0 #ffffff80;
}
.primary:hover,.welcome .welcome-ok:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 9px 22px var(--ui-glow)}
.toast{backdrop-filter:blur(16px);box-shadow:0 12px 35px #0008;animation:nova-pop .2s var(--ui-ease) both}
.image-viewer{backdrop-filter:blur(12px);animation:nova-fade .2s ease both}
.image-viewer img{box-shadow:0 20px 70px #0009;animation:nova-zoom .25s var(--ui-ease) both}
.preview{box-shadow:0 4px 12px #0003;transition:transform .2s}
.preview:hover{transform:translateY(-3px)}
@keyframes nova-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes nova-pop{from{opacity:0;transform:scale(.97) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes nova-fade{from{opacity:0}to{opacity:1}}
@keyframes nova-zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes nova-shine{0%,72%,100%{left:-45%}84%{left:125%}}
@media(max-width:700px){
  .side{box-shadow:20px 0 55px #0008}
  .top{backdrop-filter:blur(14px)}
  .welcome{margin:14px auto;border-radius:18px}
  .idea:hover,.btn:hover,.genbtn:hover,.deepthink:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* ===== Follow-up refinements: supplied Nova icon, stable menus, gentle hover scale ===== */
.logo{display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit}
.btn:hover,.genbtn:hover,.deepthink:hover,.send:hover,.idea:hover,.primary:hover,
.welcome .welcome-ok:hover{
  transform:scale(1.045)!important;
  filter:none!important;
  color:inherit;
}
.btn:active,.genbtn:active,.deepthink:active,.send:active,.idea:active,.primary:active{
  transform:scale(.975)!important;
}
.dots{
  flex:0 0 34px!important;width:34px!important;height:34px!important;
  display:inline-flex;align-items:center;justify-content:center;
  position:relative;z-index:2;cursor:pointer;
  touch-action:manipulation;
}
.dots:hover{transform:scale(1.06)!important;background:var(--hover)!important;color:var(--text)!important}
.menu{
  box-sizing:border-box!important;
  width:min(210px,calc(100vw - 16px))!important;
  max-width:calc(100vw - 16px)!important;
  max-height:calc(100dvh - 16px)!important;
  overflow-y:auto!important;overflow-x:hidden!important;
  padding:6px!important;
  transform-origin:top left;
  overscroll-behavior:contain;
}
.menu button{
  box-sizing:border-box;width:100%;min-height:36px;
  padding:9px 10px!important;white-space:normal;
  line-height:1.35;cursor:pointer;
}
.menu button:hover{transform:none!important;background:var(--hover)!important;color:var(--text)!important}
.rowchat{min-width:0;gap:5px}
.openchat{min-width:0}
@media(max-width:700px){
  .menu{width:min(210px,calc(100vw - 16px))!important}
}


/* ===== V3 corrections from screenshots ===== */
/* Use the actual Nova artwork in both the sidebar brand and the welcome/empty-chat hero. */
.logo,.mark{
  background:transparent!important;
  color:inherit!important;
  box-shadow:none!important;
  border:0!important;
  overflow:visible!important;
  padding:0!important;
}
.logo::before,.logo::after,.mark::before,.mark::after{content:none!important;display:none!important}
.logo img,.mark img{
  display:block!important;width:100%!important;height:100%!important;
  object-fit:contain!important;border:0!important;border-radius:0!important;
  background:transparent!important;box-shadow:none!important;
}
.logo{width:48px!important;height:48px!important;flex:0 0 48px}
.mark{width:112px!important;height:112px!important;border-radius:0!important;flex:0 0 auto}
.welcome .mark{margin:0 auto 6px!important}
.welcome .mark img{filter:drop-shadow(0 8px 18px #008cff30)}
/* Keep the chat-list row completely stationary on hover; no extra pill/ghost shape. */
.rowchat,.rowchat:hover,.rowchat:focus,.rowchat:focus-within{
  transform:none!important;
  box-shadow:none!important;
}
.rowchat:hover{
  background:transparent!important;
  border-color:transparent!important;
}
.rowchat.active:hover{
  background:transparent!important;
  border-color:color-mix(in srgb,var(--accent) 34%,var(--line))!important;
  box-shadow:inset 3px 0 var(--accent)!important;
}
.openchat:hover,.dots:hover{transform:none!important}
.dots:hover{background:transparent!important;color:var(--muted)!important}
.rowchat .dots:hover{background:transparent!important}


/* ===== V4: fixed welcome view, animated spectrum composer, soft accent themes ===== */
/* Keep the empty-chat welcome card inside the available chat viewport. */
.messages:has(.welcome){overflow:hidden!important}
.messages:has(.welcome)>.inner{height:100%;min-height:0}
.messages .welcome{
  height:100%!important;min-height:0!important;box-sizing:border-box;
  padding:clamp(10px,2vh,22px)!important;gap:0;
  justify-content:center;overflow:hidden;
}
.messages .welcome .mark{flex:0 0 auto;margin:0 auto 5px!important}
.messages .welcome .mark img{width:100%!important;height:100%!important;object-fit:contain}

function showWelcome(){modal('Welcome to Nova AI',`<div class="welcome" style="margin:0;border:0;padding:4px"><h2>✨ A few tips to get started</h2><ul><li><b>You can generate images</b> — Write your idea, then click the <b>Image</b> button.</li><li><b>You can use Deepthink AI</b> — Turn on the <b>✧ Deepthink</b> button beside Send for a more deliberate, step-by-step answer.</li><li><b>You can upload your file</b> — Click the <b>＋</b> button to attach an image or file supported by the app.</li></ul></div>`,[{label:'Let’s start',primary:true,fn:()=>$('modal').innerHTML=''}])}
function openImageViewer(src){const wrap=document.createElement('div');wrap.className='image-viewer';wrap.innerHTML='<button class="close-viewer">Close ✕</button><img alt="Full size image" src="'+src+'">';wrap.querySelector('.close-viewer').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};document.body.append(wrap)}
async function downloadImage(src,name){try{const r=await fetch(src);if(!r.ok)throw Error('Download failed');const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name||'nova-ai-image.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){try{window.open(src,'_blank','noopener')}catch{}say('Image opened in a new tab. If download did not start, use the image menu to save it.')}} 
$('deepthink').onclick=()=>{deepthinkEnabled=!deepthinkEnabled;$('deepthink').classList.toggle('active',deepthinkEnabled);$('deepthink').setAttribute('aria-pressed',String(deepthinkEnabled));$('deepthink').innerHTML=deepthinkEnabled?'✧ Deepthink On':'✧ Deepthink';say(deepthinkEnabled?'Deepthink enabled':'Deepthink disabled')};
async function send(){if(busy){controller?.abort();return}let text=$('prompt').value.trim();if(!text&&!images.length)return;if(!token){authModal();say('Sign in to save and send chats');return}if(!window.puter?.ai){say('Puter.js unavailable. Check your connection.');return}try{if(window.puter.auth?.isSignedIn&&!await puter.auth.isSignedIn()){await puter.auth.signIn()}}catch(e){say('Puter sign-in is needed to use AI: '+e.message);return}if(!current()){try{let r=await api('/api/chats',{method:'POST',body:JSON.stringify({title:text.slice(0,42)||'Image question'})});chats.push(r.chat);activeId=r.chat.id}catch(e){say(e.message);return}}
let c=current(),imgs=images.slice();images=[];preview();c.messages.push({role:'user',content:text||'Please describe this image.',images:imgs});if(c.title==='New chat')c.title=(text||'Image question').slice(0,45);$('prompt').value='';resize();await persist(c);
let hist=c.messages.slice(0,-1).map(m=>m.role==='user'&&m.images?.length?{role:'user',content:[{type:'text',text:m.content},...m.images.map(url=>({type:'image_url',image_url:{url}}))]}:{role:m.role,content:m.content});
let content=imgs.length?[{type:'text',text:text||'Please describe this image.'},...imgs.map(url=>({type:'image_url',image_url:{url}}))]:text;c.messages.push({role:'assistant',content:''});render();busy=true;controller=new AbortController();$('send').textContent='■';
try{let stream=await puter.ai.chat([{role:'system',content:`You are Nova-DSS CPL Ai, a helpful assistant. ${deepthinkEnabled?'Deepthink mode is enabled: reason carefully internally, break complex tasks into clear steps, verify assumptions, and give a well-structured answer. Do not reveal hidden chain-of-thought; provide concise reasoning summaries instead.':''} Use Markdown where helpful; be honest about uncertainty.`},...hist,{role:'user',content}],{model:$('model').value,stream:true,signal:controller.signal});let a=c.messages.at(-1),target=null;for await(let p of stream){if(p.type==='error')throw Error(p.message||'AI error');if(p.type==='text'&&p.text){a.content+=p.text;if(!target){render();target=$('inner').querySelectorAll('.msg.assistant .content');target=target[target.length-1]}if(target)target.textContent=a.content;scroll()}}if(!a.content)a.content='No text response received.'}catch(e){let a=c.messages.at(-1);if(e.name==='AbortError'){if(!a.content)c.messages.pop();else a.content+='\n\n(Stopped)'}else a.content+=(a.content?'\n\n':'')+'Error: '+e.message}finally{busy=false;controller=null;$('send').textContent='↑';await persist(c);render()}}
async function generateImage(){const prompt=$('prompt').value.trim();if(!prompt){say('Write a description of the image first.');$('prompt').focus();return}if(!token){authModal();say('Sign in to save generated images');return}if(!window.puter?.ai?.txt2img){say('Image generation is not available in this Puter.js version.');return}try{if(window.puter.auth?.isSignedIn&&!await puter.auth.isSignedIn())await puter.auth.signIn();let c=current();if(!c){let r=await api('/api/chats',{method:'POST',body:JSON.stringify({title:prompt.slice(0,42)||'Generated image'})});chats.push(r.chat);activeId=r.chat.id;c=r.chat}const promptText=prompt;$('prompt').value='';resize();c.messages.push({role:'user',content:'Generate an image: '+promptText});c.title=c.title==='New chat'?promptText.slice(0,45):c.title;render();say('Generating image…');const result=await puter.ai.txt2img(promptText);let src='';if(typeof result==='string')src=result;else if(result instanceof HTMLImageElement)src=result.src;else if(result?.src)src=result.src;else if(result?.url)src=result.url;if(!src)throw Error('Puter returned an image in an unsupported format.');c.messages.push({role:'assistant',content:'Generated image for: '+promptText,images:[src]});await persist(c);render();say('Image generated')}catch(e){say('Image generation failed: '+e.message)}}$('generate').onclick=generateImage;
$('send').onclick=send;$('prompt').oninput=resize;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('new').onclick=newChat;$('hamb').onclick=()=>$('side').classList.toggle('open');
$('theme').onclick=async()=>{settings.theme=settings.theme==='light'?'dark':'light';apply();if(token)try{await api('/api/settings',{method:'PUT',body:JSON.stringify(settings)})}catch(e){say(e.message)}};
function modal(title,body,buttons){$('modal').innerHTML=`<div class="backdrop"><div class="modal"><div class="modalhead"><h2>${esc(title)}</h2><button class="btn" id="x">×</button></div><div id="mbody">${body}</div><div class="modalactions" id="mact"></div></div></div>`;$('x').onclick=()=>$('modal').innerHTML='';$('modal').firstElementChild.onclick=e=>{if(e.target===$('modal').firstElementChild)$('modal').innerHTML=''};buttons.forEach(x=>{let b=document.createElement('button');b.className='btn '+(x.primary?'primary':'');b.textContent=x.label;b.onclick=x.fn;$('mact').append(b)})}
function authModal(){let mode='login';function draw(){modal('Account',`<div class="notice">Account and chat data are saved on this server in the <code>data/</code> folder.</div><div class="field"><label>Username</label><input id="au" autocomplete="username" minlength="3" maxlength="32" placeholder="username"></div><div class="field"><label>Password (8+ characters)</label><input id="ap" type="password" autocomplete="current-password" minlength="8"></div><div id="ae" style="color:var(--danger);font-size:12px"></div><p><button class="btn" id="loginTab">Sign in</button> <button class="btn" id="registerTab">Create account</button></p>`,[{label:'Cancel',fn:()=>$('modal').innerHTML=' '},{label:mode==='login'?'Sign in':'Create account',primary:true,fn:async()=>{try{let r=await api('/api/'+mode,{method:'POST',body:JSON.stringify({username:$('au').value,password:$('ap').value})});token=r.token;localStorage.setItem('nova-token',token);account=r.account;settings={...settings,...account.settings};$('modal').innerHTML='';apply();updateAccount();await load();say('Welcome!');if(mode==='register')showWelcome()}catch(e){$('ae').textContent=e.message}}}]);$('loginTab').onclick=()=>{mode='login';draw()};$('registerTab').onclick=()=>{mode='register';draw()}}draw()}
function updateAccount(){$('who').textContent=account?account.username:'Not signed in';$('account').textContent=account?'Sign out':'Sign in'}
$('account').onclick=async()=>{if(!account){authModal();return}if(confirm('Sign out?')){try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}token='';localStorage.removeItem('nova-token');sessionStorage.removeItem('nova-token');account=null;chats=[];activeId=null;updateAccount();render()}};
$('settings').onclick=()=>{modal('Settings',`<div class="field"><label>Account username</label><input id="accountname" maxlength="32" value="${esc(account?.username||'')}" placeholder="Sign in to change username"></div><div class="notice">Changing the username updates the account display name. It does not change your password.</div><div class="field"><label>AI name</label><input id="sname" maxlength="50" value="${'Nova-DSS CPL Ai'}"></div><div class="field"><label>Theme</label><select id="stheme"><option value="dark">Dark · Purple</option><option value="light">Light · Purple</option><option value="orange">Soft Orange</option><option value="green">Soft Green</option><option value="blue">Soft Blue</option><option value="red">Soft Red</option><option value="white">White</option><option value="system">System (dark fallback)</option></select></div><div class="field"><label>Font</label><select id="sfont"><option value="system">System default</option><option value="custom">Custom WOFF2</option></select></div><div class="notice">Place your font file at <code>fonts/custom.woff2</code>. Settings are saved to <code>data/accounts.json</code> when signed in. Your Nova login is remembered on this browser. Puter sign-in is separate and managed by Puter; never embed a shared username, password, or secret in frontend code.</div>`,[{label:'Delete all chats',fn:async()=>{if(!token){say('Sign in first');return}if(!confirm('Delete ALL chats and their share links? This cannot be undone.'))return;try{await api('/api/chats/all',{method:'DELETE'});chats=[];activeId=null;$('modal').innerHTML='';render();say('All chats deleted')}catch(e){say(e.message)}}},{label:'Cancel',fn:()=>$('modal').innerHTML=''}, {label:'Save settings',primary:true,fn:async()=>{settings={assistantName:$('sname').value.trim()||'Nova-DSS CPL Ai',theme:$('stheme').value,font:$('sfont').value};apply();if(token)try{await api('/api/settings',{method:'PUT',body:JSON.stringify(settings)});const uname=$('accountname').value.trim();if(uname&&uname!==account.username){const r=await api('/api/account',{method:'PATCH',body:JSON.stringify({username:uname})});account=r.account;updateAccount()}}catch(e){say(e.message);return}$('modal').innerHTML='';say('Settings saved')}}]);$('stheme').value=settings.theme;$('sfont').value=settings.font};
async function boot(){apply();applyLanguage();updateAccount();if(token){try{let r=await api('/api/me');account=r.account;settings={...settings,...account.settings};apply();updateAccount();await load()}catch{token='';localStorage.removeItem('nova-token');sessionStorage.removeItem('nova-token')}}if(!token){render();authModal()}}
document.addEventListener('click',e=>{if(!e.target.closest('.dots')&&!e.target.closest('.menu'))document.querySelectorAll('.menu').forEach(x=>x.remove())});window.addEventListener('resize',()=>document.querySelectorAll('.menu').forEach(x=>x.remove()));document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.menu').forEach(x=>x.remove());document.querySelectorAll('.image-viewer').forEach(x=>x.remove());if(busy)controller?.abort()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();newChat()}});boot();
})();
</script></body></html>
